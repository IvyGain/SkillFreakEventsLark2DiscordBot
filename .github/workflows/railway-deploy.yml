name: Deploy to Railway

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Install Railway CLI
      run: npm install -g @railway/cli
      
    - name: Deploy to Railway
      run: railway up --detach
      env:
        RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        
    - name: Set Environment Variables (if secrets are configured)
      if: ${{ env.LARK_APP_ID != '' }}
      run: |
        railway variables set LARK_APP_ID="${{ secrets.LARK_APP_ID }}"
        railway variables set LARK_APP_SECRET="${{ secrets.LARK_APP_SECRET }}"
        railway variables set LARK_TABLE_ID="${{ secrets.LARK_TABLE_ID }}"
        railway variables set DISCORD_BOT_TOKEN="${{ secrets.DISCORD_BOT_TOKEN }}"
        railway variables set DISCORD_GUILD_ID="${{ secrets.DISCORD_GUILD_ID }}"
        railway variables set DISCORD_NOTIFICATION_CHANNEL_ID="${{ secrets.DISCORD_NOTIFICATION_CHANNEL_ID }}"
      env:
        RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        
    - name: Health Check
      run: |
        sleep 30
        curl -f https://web-production-e41e2.up.railway.app/health || exit 1